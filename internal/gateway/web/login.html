<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Codar2API</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden;color:#2A2622;background:radial-gradient(#E5D2A8 1.3px,transparent 1.4px) 0 0/20px 20px,#FFF3D9;font:14px/1.6 ui-rounded,"Nunito","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif}
main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(380px,100%);padding:34px 30px 24px;background:#FFFDF7;border:2.5px solid #2A2622;border-radius:22px;box-shadow:8px 8px 0 #2A2622;transform:rotate(-1deg)}
main::before{content:"";position:absolute;top:-13px;left:50%;width:96px;height:26px;margin-left:-48px;background:rgba(138,201,255,.7);border:1.5px dashed rgba(42,38,34,.4);transform:rotate(-3deg)}
h1{margin:0 0 6px;padding:4px 18px;font-size:24px;font-weight:900;background:#FFD84D;border:2.5px solid #2A2622;border-radius:16px;box-shadow:3px 3px 0 #2A2622;transform:rotate(-2.5deg)}
form{display:flex;flex-direction:column;gap:12px;width:100%}
input,button{width:100%;font:inherit;color:inherit;border:2.5px solid #2A2622;border-radius:999px;padding:10px 16px}
input{background:#fff}input:focus{outline:0;box-shadow:3px 3px 0 #FF8FB7}
button{background:#FF8FB7;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 #2A2622;transition:transform .12s,box-shadow .12s}
button:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 #2A2622}button:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}button:disabled{opacity:.6;cursor:default}
#error{min-height:20px;margin:0;color:#A3203C;font-size:13px;text-align:center}
.d{position:absolute;z-index:1;border:2.5px solid #2A2622;box-shadow:4px 4px 0 #2A2622}
.d1{left:14%;top:16%;width:90px;height:90px;border-radius:50%;background:#FF8FB7}.d2{right:16%;top:22%;width:70px;height:70px;border-radius:18px;background:#8BE0A4;transform:rotate(18deg)}
.d3{right:22%;bottom:12%;width:120px;height:120px;border-radius:30px;background:#FFD84D;transform:rotate(-12deg)}
@media (max-width:600px){.d{display:none}}
</style></head>
<body><span class="d d1"></span><span class="d d2"></span><span class="d d3"></span>
<main><h1>Codar2API</h1><form id="form"><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码" aria-label="管理员密码" required autofocus maxlength="1024"><button id="submit" type="submit">进入面板</button><p id="error" role="alert"></p></form></main>
<script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('#submit'),err=document.querySelector('#error');b.disabled=true;err.textContent='';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error?.message||'登录失败');location.replace('/')}catch(e){err.textContent=e.message}finally{b.disabled=false}};</script></body></html>
