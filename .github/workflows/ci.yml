name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race ./... -count=1 -timeout=120s
      - run: test -z "$(gofmt -l cmd internal)"
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux-amd64, linux-arm64, windows-amd64, darwin-amd64, darwin-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - shell: bash
        run: |
          export GOOS="${{ matrix.target }}"
          export GOARCH="${GOOS#*-}"
          export GOOS="${GOOS%%-*}"
          export CGO_ENABLED=0
          name=codar2api
          if [ "$GOOS" = windows ]; then name=codar2api.exe; fi
          go build -trimpath -ldflags="-s -w" -o "dist/$name" ./cmd/codar
      - uses: actions/upload-artifact@v4
        with:
          name: codar2api-${{ matrix.target }}
          path: dist/
  docker-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Docker source version and explicit override
        shell: bash
        run: |
          set -euo pipefail
          expected="$(go run ./cmd/codar --version)"

          docker build --target build -t codar2api:version-default .
          test "$(docker run --rm --network none --entrypoint /out/codar codar2api:version-default --version)" = "$expected"

          docker build --target build --build-arg VERSION= -t codar2api:version-empty .
          test "$(docker run --rm --network none --entrypoint /out/codar codar2api:version-empty --version)" = "$expected"

          docker build --target build --build-arg VERSION=0.0.0-ci -t codar2api:version-override .
          test "$(docker run --rm --network none --entrypoint /out/codar codar2api:version-override --version)" = "Codar2API 0.0.0-ci"
